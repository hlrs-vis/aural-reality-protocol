edition = "2023";

package auralreality;

import "transform.proto";

enum ChoreographyElementType {
    SoundItem = 0;
    ChoreographyItem = 1;
}

message ChoreographyElement {
    string id = 1;
    ChoreographyElementType type = 2;
    string reference_id = 3;
    Transform transform = 4;
    string trajectory_id = 5;
}

message Choreography {
    string id = 1;
    string name = 2;
    repeated ChoreographyElement persisting_elements = 3;
}
